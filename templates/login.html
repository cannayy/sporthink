<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sporthink — Giriş</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap');

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'DM Sans', -apple-system, sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: #f4f5f7;
  background-image:
    radial-gradient(circle at 20% 20%, rgba(214,69,69,0.04) 0%, transparent 50%),
    radial-gradient(circle at 80% 80%, rgba(214,69,69,0.03) 0%, transparent 50%);
  position: relative;
}

.page-footer {
  position: fixed;
  bottom: 20px;
  width: 100%;
  text-align: center;
  font-size: 11px;
  color: #b0bec8;
}
.page-footer span { color: #D64545; }

.login-card {
  background: #ffffff;
  border: 1px solid rgba(0,0,0,0.08);
  border-radius: 20px;
  padding: 0;
  overflow: hidden;
  width: 100%;
  max-width: 420px;
  box-shadow:
    0 1px 2px rgba(0,0,0,0.04),
    0 8px 32px rgba(0,0,0,0.08),
    0 32px 64px rgba(0,0,0,0.04);
}

.brand-strip {
  height: 4px;
  background: linear-gradient(90deg, #D64545 0%, #8E2820 100%);
}

.card-inner { padding: 40px 44px 36px; }

.lockup { text-align: center; margin-bottom: 30px; }
.lockup img { height: 56px; display: block; margin: 0 auto 18px; object-fit: contain; }
.lockup .card-eyebrow {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: #D64545;
  margin-bottom: 10px;
}
.lockup h1 {
  font-size: 26px;
  font-weight: 700;
  color: #1a1a2e;
  letter-spacing: -0.02em;
  margin: 0 0 6px;
}
.lockup p {
  font-size: 13.5px;
  color: #6b7280;
  margin: 0 auto;
  max-width: 320px;
  line-height: 1.5;
}

.field-label {
  font-size: 12px;
  font-weight: 600;
  color: #4a5568;
  margin-bottom: 6px;
  display: block;
  letter-spacing: 0.02em;
}

.field {
  position: relative;
  margin-bottom: 14px;
}

.field input {
  width: 100%;
  padding: 12px 14px;
  font-size: 13.5px;
  font-family: inherit;
  border: 1.5px solid rgba(0,0,0,0.10);
  border-radius: 10px;
  background: #f8f9fb;
  color: #1a1a2e;
  outline: none;
  transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
}
.field input::placeholder { color: #c0ccd8; }
.field input:focus {
  border-color: #D64545;
  background: #fff;
  box-shadow: 0 0 0 3px rgba(214,69,69,0.10);
}

.field .toggle-pw {
  position: absolute;
  right: 13px; top: 50%; transform: translateY(-50%);
  cursor: pointer;
  color: #c0ccd8;
  display: flex; align-items: center;
  transition: color 0.15s;
}
.field .toggle-pw:hover { color: #888; }
.field.has-toggle input { padding-right: 42px; }

.form-options {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
  margin-top: 4px;
}
.remember-wrap {
  display: flex; align-items: center; gap: 7px;
  cursor: pointer; user-select: none;
}
.remember-wrap input[type=checkbox] {
  width: 15px; height: 15px;
  border-radius: 4px;
  accent-color: #D64545;
  cursor: pointer;
}
.remember-label {
  font-size: 12px;
  color: #6b7280;
  font-weight: 500;
}
.forgot-link {
  font-size: 12px;
  color: #6b7280;
  text-decoration: none;
  font-weight: 500;
  transition: color 0.15s;
}
.forgot-link:hover { color: #D64545; }

.btn-login {
  width: 100%;
  padding: 13px;
  font-size: 14px;
  font-weight: 700;
  font-family: inherit;
  letter-spacing: 0.1px;
  color: #fff;
  background: linear-gradient(135deg, #D64545 0%, #8E2820 100%);
  border: none;
  border-radius: 10px;
  cursor: pointer;
  transition: filter 0.2s, transform 0.1s, box-shadow 0.2s;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  box-shadow: 0 6px 20px rgba(214,69,69,0.22);
}
.btn-login:hover { filter: brightness(1.05); box-shadow: 0 8px 24px rgba(214,69,69,0.30); }
.btn-login:active { transform: scale(0.99); }
.btn-login:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }

.btn-spinner {
  display: none;
  width: 15px; height: 15px;
  border: 2px solid rgba(255,255,255,0.3);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin 0.6s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.error-msg {
  background: rgba(214,69,69,0.06);
  border: 1px solid rgba(214,69,69,0.18);
  color: #8E2820;
  font-size: 12.5px;
  font-weight: 500;
  padding: 10px 14px;
  border-radius: 10px;
  margin-bottom: 14px;
  display: none;
  align-items: center;
  gap: 8px;
}
.error-msg.show { display: flex; }
</style>
</head>
<body>

<div class="login-card">
  <div class="brand-strip"></div>
  <div class="card-inner">

    <div class="lockup">
      <img src="{{ url_for('static', filename='images/sporthink-logo.png') }}" alt="Sporthink">
      <div class="card-eyebrow">Satış Analiz Paneli</div>
      <h1>Tekrar hoş geldiniz</h1>
      <p>Devam etmek için hesabınıza giriş yapın</p>
    </div>

    <div class="error-msg" id="error-msg">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <span id="error-text">E-posta veya şifre hatalı.</span>
    </div>

    <form id="login-form" onsubmit="handleLogin(event)">

      <div class="field">
        <label class="field-label" for="email">E-posta</label>
        <input type="email" id="email" placeholder="ornek@sporthink.com" autocomplete="email" required>
      </div>

      <div class="field has-toggle">
        <label class="field-label" for="password">Şifre</label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
        <span class="toggle-pw" onclick="togglePw()">
          <svg id="eye-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
            <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
            <line x1="1" y1="1" x2="23" y2="23"/>
          </svg>
        </span>
      </div>

      <div class="form-options">
        <label class="remember-wrap">
          <input type="checkbox" id="remember">
          <span class="remember-label">Beni hatırla</span>
        </label>
        <a href="/sifremi-unuttum" class="forgot-link">Şifremi unuttum</a>
      </div>

      <button type="submit" class="btn-login" id="login-btn">
        <div class="btn-spinner" id="btn-spinner"></div>
        <span id="btn-text">Giriş Yap</span>
      </button>

    </form>

  </div>
</div>

<div class="page-footer">
  © 2026 <span>Sporthink</span> — Tüm hakları saklıdır.
</div>

<script>
function togglePw() {
  const input = document.getElementById('password');
  const icon = document.getElementById('eye-icon');
  if (input.type === 'password') {
    input.type = 'text';
    icon.innerHTML = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
  } else {
    input.type = 'password';
    icon.innerHTML = `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>`;
  }
}

async function handleLogin(e) {
  e.preventDefault();
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const err = document.getElementById('error-msg');
  const btn = document.getElementById('login-btn');
  const spinner = document.getElementById('btn-spinner');
  const btnText = document.getElementById('btn-text');

  err.classList.remove('show');
  btn.disabled = true;
  spinner.style.display = 'block';
  btnText.textContent = 'Giriş yapılıyor...';

  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });

    if (res.ok) {
      btnText.textContent = '✓ Yönlendiriliyor...';
      window.location.href = '/';
    } else {
      const data = await res.json().catch(() => ({}));
      document.getElementById('error-text').textContent = data.message || 'E-posta veya şifre hatalı.';
      err.classList.add('show');
      btn.disabled = false;
      spinner.style.display = 'none';
      btnText.textContent = 'Giriş Yap';
    }
  } catch (error) {
    document.getElementById('error-text').textContent = 'Bağlantı hatası. Lütfen tekrar deneyin.';
    err.classList.add('show');
    btn.disabled = false;
    spinner.style.display = 'none';
    btnText.textContent = 'Giriş Yap';
  }
}

document.addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('login-form').requestSubmit(); });
</script>
</body>
</html>
