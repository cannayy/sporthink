<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sporthink — Hesabınızı Oluşturun</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap');
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'DM Sans', sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #f4f5f7; background-image: radial-gradient(circle at 20% 20%, rgba(224,32,32,0.04) 0%, transparent 50%); }
.top-logo { position: fixed; top: 24px; left: 28px; }
.top-logo img { height: 32px; }
.card { background: #fff; border: 1px solid rgba(0,0,0,0.08); border-radius: 20px; padding: 44px 40px 36px; width: 100%; max-width: 420px; box-shadow: 0 8px 32px rgba(0,0,0,0.08); }
.card-logo { display: flex; justify-content: center; margin-bottom: 20px; }
.card-logo img { height: 28px; }
.divider { height: 1px; background: rgba(0,0,0,0.07); margin-bottom: 22px; }
.welcome-badge { display: inline-flex; align-items: center; gap: 6px; background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 20px; padding: 4px 12px; font-size: 11px; font-weight: 600; color: #15803d; margin-bottom: 14px; }
.card-title { font-size: 20px; font-weight: 700; color: #1a1a2e; margin-bottom: 6px; }
.card-sub { font-size: 13px; color: #8a9ab5; margin-bottom: 26px; line-height: 1.5; }
.user-info { background: #f8f9fb; border: 1px solid #e8eaed; border-radius: 10px; padding: 10px 14px; margin-bottom: 20px; font-size: 12px; color: #6b7280; }
.user-info strong { color: #1a1a2e; font-weight: 600; }
.field-label { font-size: 12px; font-weight: 600; color: #4a5568; margin-bottom: 6px; display: block; }
.field { position: relative; margin-bottom: 14px; }
.field input { width: 100%; padding: 12px 42px 12px 14px; font-size: 13.5px; font-family: inherit; border: 1.5px solid rgba(0,0,0,0.10); border-radius: 10px; background: #f8f9fb; color: #1a1a2e; outline: none; transition: all 0.2s; }
.field input:focus { border-color: #e02020; background: #fff; box-shadow: 0 0 0 3px rgba(224,32,32,0.08); }
.toggle-pw { position: absolute; right: 13px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #c0ccd8; }
.toggle-pw:hover { color: #888; }
.strength-bar { height: 4px; border-radius: 2px; background: #eee; margin-top: 6px; overflow: hidden; }
.strength-fill { height: 100%; border-radius: 2px; transition: all 0.3s; width: 0; }
.strength-text { font-size: 11px; margin-top: 4px; font-weight: 500; }
.btn { width: 100%; padding: 13px; font-size: 14px; font-weight: 600; font-family: inherit; color: #fff; background: #e02020; border: none; border-radius: 10px; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 8px; }
.btn:hover { background: #c01818; box-shadow: 0 4px 16px rgba(224,32,32,0.25); }
.btn:disabled { opacity: 0.7; cursor: not-allowed; }
.spinner { display: none; width: 15px; height: 15px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.6s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.error-msg { background: rgba(224,32,32,0.06); border: 1px solid rgba(224,32,32,0.18); color: #c01818; font-size: 12.5px; font-weight: 500; padding: 10px 14px; border-radius: 10px; margin-bottom: 14px; display: none; }
.error-msg.show { display: block; }
.redirect-box { display: none; text-align: center; padding: 8px 0; }
.redirect-icon { width: 56px; height: 56px; background: #f0fdf4; border: 2px solid #d4edda; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; }
.redirect-title { font-size: 18px; font-weight: 700; color: #1a1a2e; margin-bottom: 8px; }
.redirect-sub { font-size: 13px; color: #6b7a90; line-height: 1.6; }
.progress-bar { height: 3px; background: #e8eaed; border-radius: 2px; margin-top: 20px; overflow: hidden; }
.progress-fill { height: 100%; background: #e02020; border-radius: 2px; animation: progressAnim 2.5s linear forwards; }
@keyframes progressAnim { from { width: 0; } to { width: 100%; } }
.page-footer { position: fixed; bottom: 20px; width: 100%; text-align: center; font-size: 11px; color: #b0bec8; }
.page-footer span { color: #e02020; }
</style>
</head>
<body>

<a class="top-logo" href="/login">
  <img src="{{ url_for('static', filename='images/sporthink-logo.png') }}" alt="Sporthink">
</a>

<div class="card">
  <div class="card-logo">
    <img src="{{ url_for('static', filename='images/sporthink-logo.png') }}" alt="Sporthink">
  </div>
  <div class="divider"></div>

  <div id="form-section">
    <div class="welcome-badge">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>
      Davet Onaylandı
    </div>
    <div class="card-title">Hesabınızı Oluşturun</div>
    <div class="card-sub">Merhaba {% if ad %}<strong>{{ ad }}</strong>, {% endif %}şifrenizi belirleyerek panele erişebilirsiniz.</div>

    <div class="user-info">
      Hesap: <strong>{{ email }}</strong>
    </div>

    <div class="error-msg" id="error-msg"></div>

    <form onsubmit="handleSubmit(event)">
      <div class="field">
        <label class="field-label">Şifre Belirleyin</label>
        <input type="password" id="sifre" placeholder="En az 6 karakter" oninput="checkStrength()" required autofocus>
        <span class="toggle-pw" onclick="togglePw('sifre','eye1')">
          <svg id="eye1" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
        </span>
        <div class="strength-bar"><div class="strength-fill" id="strength-fill"></div></div>
        <div class="strength-text" id="strength-text"></div>
      </div>

      <div class="field">
        <label class="field-label">Şifre Tekrar</label>
        <input type="password" id="sifre2" placeholder="Şifrenizi tekrar girin" required>
        <span class="toggle-pw" onclick="togglePw('sifre2','eye2')">
          <svg id="eye2" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
        </span>
      </div>

      <button type="submit" class="btn" id="submit-btn">
        <div class="spinner" id="spinner"></div>
        <span id="btn-text">Hesabımı Oluştur</span>
      </button>
    </form>
  </div>

  <div class="redirect-box" id="redirect-section">
    <div class="redirect-icon">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2e7d32" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>
    </div>
    <div class="redirect-title">Hesabınız Hazır!</div>
    <div class="redirect-sub">Şifreniz belirlendi. Dashboard'a yönlendiriliyorsunuz...</div>
    <div class="progress-bar"><div class="progress-fill"></div></div>
  </div>
</div>

<div class="page-footer">© 2025 <span>Sporthink</span> — Tüm hakları saklıdır.</div>

<script>
const TOKEN = "{{ token }}";

function togglePw(inputId, iconId) {
  const input = document.getElementById(inputId);
  const icon = document.getElementById(iconId);
  if (input.type === 'password') {
    input.type = 'text';
    icon.innerHTML = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
  } else {
    input.type = 'password';
    icon.innerHTML = `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>`;
  }
}

function checkStrength() {
  const val = document.getElementById('sifre').value;
  const fill = document.getElementById('strength-fill');
  const text = document.getElementById('strength-text');
  let score = 0;
  if (val.length >= 6) score++;
  if (val.length >= 10) score++;
  if (/[A-Z]/.test(val)) score++;
  if (/[0-9]/.test(val)) score++;
  if (/[^A-Za-z0-9]/.test(val)) score++;
  const levels = [
    { w: '20%', color: '#e02020', label: 'Çok Zayıf', tc: '#e02020' },
    { w: '40%', color: '#ff7043', label: 'Zayıf',     tc: '#ff7043' },
    { w: '60%', color: '#ffc107', label: 'Orta',      tc: '#b8860b' },
    { w: '80%', color: '#66bb6a', label: 'İyi',       tc: '#2e7d32' },
    { w: '100%', color: '#4caf50', label: 'Güçlü',   tc: '#1b5e20' },
  ];
  const l = levels[Math.min(score, 4)];
  fill.style.width = val.length ? l.w : '0';
  fill.style.background = l.color;
  text.textContent = val.length ? l.label : '';
  text.style.color = l.tc;
}

async function handleSubmit(e) {
  e.preventDefault();
  const sifre  = document.getElementById('sifre').value;
  const sifre2 = document.getElementById('sifre2').value;
  const errMsg = document.getElementById('error-msg');
  const btn    = document.getElementById('submit-btn');
  const spinner = document.getElementById('spinner');
  const btnText = document.getElementById('btn-text');

  errMsg.classList.remove('show');

  if (sifre.length < 6) {
    errMsg.textContent = 'Şifre en az 6 karakter olmalıdır.';
    errMsg.classList.add('show'); return;
  }
  if (sifre !== sifre2) {
    errMsg.textContent = 'Şifreler eşleşmiyor.';
    errMsg.classList.add('show'); return;
  }

  btn.disabled = true;
  spinner.style.display = 'block';
  btnText.textContent = 'Oluşturuluyor...';

  try {
    const res = await fetch('/api/hesap-olustur', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: TOKEN, sifre })
    });
    const data = await res.json();
    if (res.ok) {
      document.getElementById('form-section').style.display = 'none';
      document.getElementById('redirect-section').style.display = 'block';
      setTimeout(() => { window.location.href = '/'; }, 2600);
    } else {
      errMsg.textContent = data.message || 'Bir hata oluştu.';
      errMsg.classList.add('show');
      btn.disabled = false;
      spinner.style.display = 'none';
      btnText.textContent = 'Hesabımı Oluştur';
    }
  } catch {
    errMsg.textContent = 'Bağlantı hatası. Lütfen tekrar deneyin.';
    errMsg.classList.add('show');
    btn.disabled = false;
    spinner.style.display = 'none';
    btnText.textContent = 'Hesabımı Oluştur';
  }
}
</script>
</body>
</html>
